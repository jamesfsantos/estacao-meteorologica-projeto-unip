version: '3.8'

services:
  # 1. Backend: API FastAPI
  api:
    extra_hosts:
        - "host.docker.internal:host-gateway"
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fastapi_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - app-network
    env_file:
        ./api/.env

  # 2. Frontend: Dashboard React (servido via Nginx)
  dashboard:
    build:
      context: ./frontend     # Caminho para a pasta do código do React
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.coredevelopement.top
    container_name: react_dashboard
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge